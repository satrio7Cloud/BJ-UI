server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    # SPA routing: semua route fallback ke index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Aset statis di-cache lama (nama file ber-hash)
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Reverse proxy ke backend — AKTIFKAN saat sudah punya domain + HTTPS,
    # lalu ubah VITE_API_BASE_URL menjadi '/api/v1' (same-origin).
    # location /api/ {
    #     proxy_pass http://127.0.0.1:3000;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }
}
