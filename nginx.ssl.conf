# Konfigurasi nginx dengan SSL (HTTPS) — untuk production
# Sertifikat di-mount dari host: /etc/letsencrypt → container (read-only)

# Redirect HTTP → HTTPS
server {
    listen 80;
    server_name uruskendaraan.web.id www.uruskendaraan.web.id;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name uruskendaraan.web.id www.uruskendaraan.web.id;

    ssl_certificate     /etc/letsencrypt/live/uruskendaraan.web.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/uruskendaraan.web.id/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    # SPA routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Aset statis di-cache lama
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Reverse proxy ke backend (PRODUCTION → port 3000)
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Swagger docs
    location /docs/ {
        proxy_pass http://127.0.0.1:3000/docs/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
